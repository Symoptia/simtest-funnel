name: CI

on:
  push:
    branches: [main, beta, develop]
  pull_request:
    branches: [main, beta, develop]

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    runs-on: ubuntu-latest
    container: ghcr.io/symoptia/simtest-funnel-devcontainer:latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  python-test:
    runs-on: ubuntu-latest
    container: ghcr.io/symoptia/simtest-funnel-devcontainer:latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - run: |
          cd crates/simtest-funnel-python && python -m maturin develop --uv
          cd /workspaces/simtest-funnel && uv run python -m pytest tests/python/ -v

  js-test:
    runs-on: ubuntu-latest
    container: ghcr.io/symoptia/simtest-funnel-devcontainer:latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - run: |
          wasm-pack build --target bundler crates/simtest-funnel-wasm --out-dir ../../packages/sdk/src/wasm
          cd packages/sdk && pnpm install && pnpm test

  lint:
    runs-on: ubuntu-latest
    container: ghcr.io/symoptia/simtest-funnel-devcontainer:latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - run: make lint
