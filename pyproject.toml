[project]
name = "simtest-funnel-workspace"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "simtest-funnel",
    "simtest-funnel-mcp",
    "numpy>=1.26",
    "pandas>=2",
]

[tool.pytest.ini_options]
testpaths = ["tests/python", "python/simtest-funnel-mcp/tests"]
addopts = "-v"

[tool.mypy]
# No python_version: mypy checks against the interpreter of the environment
# it runs in, together with the dependency stubs resolved for it (numpy 2.5's
# stubs use 3.12 syntax and give false errors when checked as 3.11). CI runs
# it on the lowest and the newest supported Python (ci.yml, python-test).
strict = true
mypy_path = [
    "crates/simtest-funnel-python/python",
    "tests/python/tools",
    "python/simtest-funnel-mcp/src",
]
namespace_packages = true
explicit_package_bases = true

[tool.uv.workspace]
members = [
    "crates/simtest-funnel-python",
    "python/simtest-funnel-mcp",
]

[tool.uv.sources]
simtest-funnel = { workspace = true, editable = true }
simtest-funnel-mcp = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "pandas-stubs",
    "maturin>=1.13.1",
    "pdoc>=14",
    # Test certificates for the local HTTPS server of the URL-fetch tests.
    "cryptography",
    # Validates the agent skill's tool-call examples (test_mcp_skill.py);
    # also pulled in by mcp.
    "jsonschema>=4",
]
