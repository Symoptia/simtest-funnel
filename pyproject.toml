[project]
name = "simtest-funnel-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "simtest-funnel",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-v"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.uv.workspace]
members = [
    "crates/simtest-funnel-python",
]

[tool.uv.sources]
simtest-funnel = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
]
