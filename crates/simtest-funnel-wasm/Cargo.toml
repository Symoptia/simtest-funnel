[package]
name = "simtest-funnel-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "WASM bindings for simtest-funnel (wasm-bindgen)"

[dependencies]
simtest-funnel-core = { path = "../simtest-funnel-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }

[lib]
crate-type = ["cdylib"]
