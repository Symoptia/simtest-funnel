[package]
name = "simtest-funnel-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command-line trajectory comparison CLI (drop-in replacement for LBNL funnel)"

[[bin]]
name = "simtest-funnel"
path = "src/main.rs"

[dependencies]
simtest-funnel-core = { path = "../simtest-funnel-core", features = ["json"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
