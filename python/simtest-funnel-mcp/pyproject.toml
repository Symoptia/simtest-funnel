[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "simtest-funnel-mcp"
version = "1.0.0-beta.11"
description = "Local MCP server for funnel (tolerance-tube) comparison of signals in CSV files"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Symoptia contributors" }]
dependencies = [
    "mcp>=2.3,<3",
    "simtest-funnel>=1.0.0b11,<2",
    "numpy>=1.26",
    "pandas>=2",
]

[project.scripts]
simtest-funnel-mcp = "simtest_funnel_mcp.server:main"

[project.urls]
Repository = "https://github.com/Symoptia/simtest-funnel"

[tool.hatch.build.targets.wheel]
packages = ["src/simtest_funnel_mcp"]
